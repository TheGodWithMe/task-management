<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:531px;height:659px;background:#FFFFFF;" width="531px" height="659px" viewBox="0 0 531 659" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="262.393" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="170.912" y="55" width="182.961" height="47.598" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="180.912" y="76.203" fill="#000" font-size="12" textLength="162.961" font-family="'Times New Roman'">Руководитель открывает задачу</text><text x="180.912" y="90.002" fill="#000" font-size="12" textLength="125.021" font-family="'Times New Roman'">в статусе «На проверке»</text><rect x="198.082" y="122.598" width="128.621" height="47.598" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="208.082" y="143.801" fill="#000" font-size="12" textLength="108.621" font-family="'Times New Roman'">Вводит комментарий</text><text x="208.082" y="157.6" fill="#000" font-size="12" textLength="105.439" font-family="'Times New Roman'">с причиной возврата</text><rect x="179.66" y="190.195" width="165.465" height="47.598" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="189.66" y="211.398" fill="#000" font-size="12" textLength="145.465" font-family="'Times New Roman'">TaskService получает запрос</text><text x="189.66" y="225.197" fill="#000" font-size="12" textLength="133.846" font-family="'Times New Roman'">POST /api/tasks/{id}/return</text><rect x="161.701" y="257.793" width="201.383" height="61.396" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="171.701" y="278.996" fill="#000" font-size="12" textLength="172.951" font-family="'Times New Roman'">TaskService проверяет